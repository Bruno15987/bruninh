<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Bruninh</title>
    <link rel="icon" type="image/png" href="favicon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            cursor: none; /* esconde o cursor padrão */
        }

        body {
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Cursor personalizado */
        .cursor {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, background 0.15s;
            mix-blend-mode: difference;
        }

        .cursor.hover {
            width: 28px;
            height: 28px;
            background: rgba(121, 200, 61, 0.4);
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 28px 22px 22px;
            border-radius: 18px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            color: #fff;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease forwards 0.2s;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            border-radius: 18px;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.95);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-wrapper {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 16px auto;
            transition: transform 0.3s ease;
        }

        .avatar-wrapper:hover {
            transform: scale(1.07);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 3px rgba(121, 200, 61, 0.15);
            transition: box-shadow 0.3s ease;
        }

        .avatar-wrapper:hover .avatar {
            box-shadow: 0 0 0 5px rgba(121, 200, 61, 0.35);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background: #79C83D;
            border-radius: 50%;
            border: 2.5px solid #111;
            box-shadow: 0 0 8px rgba(121, 200, 61, 0.6);
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: -0.3px;
            min-height: 1.4em;
            cursor: pointer;
        }

        .time {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 12px;
        }

        p.quote {
            font-size: 0.8rem;
            color: #bbb;
            font-style: italic;
            margin-bottom: 16px;
            line-height: 1.45;
            min-height: 2.8em;
        }

        .badge {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 18px;
            color: #ccc;
            background: rgba(255, 255, 255, 0.05);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .social-icons a {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.25s ease;
            font-size: 1rem;
        }

        .social-icons a:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px) scale(1.08);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .views {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 6px;
        }

        #count {
            color: #79C83D;
            font-weight: 600;
        }

        .updated {
            font-size: 0.68rem;
            color: #555;
        }

        .music-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 5;
            font-size: 0.85rem;
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .music-btn.playing {
            color: #79C83D;
            border-color: rgba(121, 200, 61, 0.3);
        }

        /* Toast de cópia */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 20, 0.9);
            color: #79C83D;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(121, 200, 61, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>

    <canvas id="matrix"></canvas>

    <div class="card">
        <button class="music-btn" id="musicBtn" title="Música">
            <i class="fa-solid fa-play"></i>
        </button>

        <div class="avatar-wrapper">
            <div class="avatar">
                <img src="favicon.jpeg" alt="Foto">
            </div>
            <div class="status"></div>
        </div>

        <h1 id="name">Bruninh</h1>
        <div class="time" id="currentTime">--:--</div>

        <p class="quote" id="quote"></p>
        <div class="badge">💻 Programador</div>

        <div class="social-icons">
            <a href="https://github.com/Bruno15987" target="_blank" class="click-sound"><i class="fa-brands fa-github"></i></a>
            <a href="https://youtube.com/@bit_systems_x" target="_blank" class="click-sound"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://instagram.com/bruninh.s_" target="_blank" class="click-sound"><i class="fa-brands fa-instagram"></i></a>
        </div>

        <div class="actions">
            <button class="copy-btn click-sound" id="copyBtn">
                <i class="fa-regular fa-copy"></i> Copiar perfil
            </button>
        </div>

        <div class="views">
            👁️ Visualizações: <span id="count">...</span>
        </div>
        <div class="updated">Atualizado em 19/08/2026</div>
    </div>

    <div class="toast" id="toast">Link copiado!</div>

    <audio id="bg-music" loop>
        <source src="sua-musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ====================== CURSOR PERSONALIZADO ======================
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, button, h1').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });

        // ====================== MATRIX COM PARTÍCULAS EXTRAS ======================
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '0123456789アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンabcdefghijklmnopqrstuvwxyz@#$%&*';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = Array(columns).fill(1);
        });

        // ====================== HORÁRIO EM TEMPO REAL ======================
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${h}:${m}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ====================== EFEITO DE DIGITAÇÃO ======================
        const nameEl = document.getElementById('name');
        const quoteEl = document.getElementById('quote');
        const fullName = 'Bruninh';
        const fullQuote = '"A mente que se abre a uma nova ideia jamais voltará ao seu tamanho original."';

        async function typeText(element, text, speed = 70) {
            element.textContent = '';
            for (let char of text) {
                element.textContent += char;
                await new Promise(r => setTimeout(r, speed));
            }
        }

        // Digita o nome e depois a frase
        (async () => {
            await typeText(nameEl, fullName, 90);
            await new Promise(r => setTimeout(r, 400));
            await typeText(quoteEl, fullQuote, 28);
        })();

        // ====================== CONTADOR ÚNICO ======================
        const counterKey = 'bruno15987-bruninh-v3';
        const storageKey = 'bruninh_visited_v3';

        async function updateCounter() {
            const countElement = document.getElementById('count');
            try {
                if (localStorage.getItem(storageKey)) {
                    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/get/${counterKey}`);
                    const data = await res.json();
                    countElement.textContent = data.value || '1';
                } else {
                    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${counterKey}`);
                    const data = await res.json();
                    countElement.textContent = data.value;
                    localStorage.setItem(storageKey, 'true');
                }
            } catch {
                countElement.textContent = '1';
            }
        }
        updateCounter();

        // ====================== SOM DE CLIQUE ======================
        function playClick() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.08);
        }

        document.querySelectorAll('.click-sound').forEach(el => {
            el.addEventListener('click', playClick);
        });

        // ====================== MÚSICA ======================
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            playClick();
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                musicBtn.classList.remove('playing');
            } else {
                music.play().catch(() => {});
                musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                musicBtn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        // ====================== COPIAR PERFIL ======================
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        });

        // ====================== EASTER EGG (5 cliques no nome) ======================
        let clickCount = 0;
        nameEl.addEventListener('click', () => {
            clickCount++;
            playClick();

            if (clickCount === 5) {
                console.log('%c✨ Você encontrou o easter egg do Bruninh! ✨', 'color: #79C83D; font-size: 16px; font-weight: bold;');
                alert('Você descobriu o easter egg! 👀\n\nContinue explorando...');
                clickCount = 0;
            }

            // Reseta se passar muito tempo
            setTimeout(() => {
                if (clickCount > 0 && clickCount < 5) clickCount = 0;
            }, 3000);
        });
    </script>
</body>
</html>
