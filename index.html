<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Bruninh</title>
    <link rel="icon" type="image/png" href="favicon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .card { position: relative; z-index: 2; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); padding: 25px 20px; border-radius: 16px; text-align: center; width: 90%; max-width: 340px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9); color: #fff; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px auto; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.2); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.3rem; margin-bottom: 10px; font-weight: 600; }
        p.quote { font-size: 0.8rem; color: #ccc; font-style: italic; margin-bottom: 15px; }
        .badge { display: inline-block; border: 1px solid rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-bottom: 20px; color: #ddd; background: rgba(255, 255, 255, 0.05); }
        .social-icons { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .social-icons a { color: #fff; text-decoration: none; background: rgba(255, 255, 255, 0.1); width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; border-radius: 50%; transition: 0.3s; }
        .views { font-size: 0.75rem; color: #888; }
        #count { color: #79C83D; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="card">
        <div class="avatar"><img src="favicon.jpeg" alt="Foto"></div>
        <h1>Bruninh</h1>
        <p class="quote">"A mente que se abre a uma nova ideia jamais voltará ao seu tamanho original."</p>
        <div class="badge">💻 Programador</div>
        <div class="social-icons">
            <a href="https://github.com/Bruno15987" target="_blank"><i class="fa-brands fa-github"></i></a>
            <a href="https://youtube.com/@bit_systems_x" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://instagram.com/bruninh.s_" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <div class="views">
            👁️ Visualizações: <span id="count">...</span>
        </div>
    </div>

    <!-- Áudio oculto rodando automaticamente em loop -->
    <!-- Substitua "sua-musica.mp3" pelo arquivo de áudio na mesma pasta -->
    <audio id="bg-music" autoplay loop>
        <source src="sua-musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Efeito Matrix
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = '0123456789';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff'; ctx.font = fontSize + 'px monospace';
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);

        // Contador de visualizações
        fetch('https://countapi.mileshilliard.com/api/v1/hit/bruno15987-bruninh-portfolio')
            .then(response => response.json())
            .then(data => {
                document.getElementById('count').textContent = data.value;
            })
            .catch(error => {
                document.getElementById('count').textContent = '1';
            });
    </script>
</body>
</html>
